name: Gerar APK Android
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Ajustar memória para CI
        run: echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m' >> android/gradle.properties
      - name: Preparar, analisar, testar e compilar
        env:
          APK_TARGET_PLATFORM: android-arm64
        run: bash scripts/gerar-apk.sh teste
      - uses: actions/upload-artifact@v4
        with:
          name: gradio-spaces-android-teste
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
